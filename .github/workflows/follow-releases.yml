name: follow releases

# Keeps the formula on the newest Fearlezz release without a secret in the other repository.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rewrite the formula for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo fearlezz-dev/fearlezz --json tagName --jq .tagName)
          .github/update-formula.sh "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Commit the change
        run: |
          if git diff --quiet; then
            echo "formula already at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fearlezz $TAG"
          git push
